[build]
  command = "npm run build"
  publish = "dist"

# a raiz do site abre a SPA (o index.html fica em /html)
[[redirects]]
  from = "/"
  to = "/html/index.html"
  status = 200

# imagens, css e js: cache longo no navegador e na CDN
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
